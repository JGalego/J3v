name: Release

on:
  push:
    tags: ["v*"]
  # manual release: creates the tag on the dispatched commit (for pushers that cannot push tags)
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to create and release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  MINILM: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41

jobs:
  binaries:
    name: j3v (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p j3v
      - name: package
        run: |
          n=j3v-${TAG}-${{ matrix.target }}
          mkdir $n && cp target/${{ matrix.target }}/release/j3v LICENSE README.md $n/
          tar czf $n.tar.gz $n
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: j3v-*.tar.gz

  models:
    name: example artifacts + shared encoder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo build --release --locked -p j3v
      - name: shared int8 encoder
        run: |
          mkdir -p hf && for f in model.safetensors config.json vocab.txt tokenizer_config.json; do curl -sSfL "$MINILM/$f" -o hf/$f; done
          ./target/release/j3v encoder import hf -o minilm.j3a sentence-transformers/all-MiniLM-L6-v2@1110a243
      - name: example artifacts and firmware
        run: |
          D=examples/support_triage
          cp $D/support_triage.pi.j3a $D/support_triage.mcu.j3a .
          ./target/release/j3v mcu-codegen $D/support_triage.mcu.j3a -o firmware/cortex-m7/src/model.rs
          (cd firmware/cortex-m7 && cargo build --release --features stm32h743)
          cp firmware/cortex-m7/target/thumbv7em-none-eabihf/release/j3v-fw-cortex-m7 j3v-fw-stm32h743-support_triage.elf
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: |
            minilm.j3a
            support_triage.pi.j3a
            support_triage.mcu.j3a
            j3v-fw-stm32h743-support_triage.elf

  release:
    needs: [binaries, models]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums and notes
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          v=${TAG#v}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: J3v ${{ env.TAG }}
          body_path: notes.md
          files: dist/*
