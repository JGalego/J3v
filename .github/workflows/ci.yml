name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D clippy::correctness
      - run: cargo test --workspace
      - name: schema DSL smoke check
        run: cargo run --release -q -- check schemas/support_triage.j3v > /dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: python compiler stage compiles
        run: python -m compileall -q compiler

  static:
    name: static pi binary (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p j3v
      - name: check static + report size
        run: |
          f=target/${{ matrix.target }}/release/j3v
          file $f | tee /dev/stderr | grep -q "static"
          echo "### j3v (${{ matrix.target }}): $(stat -c %s $f) bytes" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: j3v-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/j3v

  arm:
    name: pi runtime on native ARM64 (latency)
    runs-on: ubuntu-24.04-arm
    env:
      MINILM: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41
    steps:
      - uses: actions/checkout@v4
      - id: art
        name: certified pi artifact present?
        run: |
          if [ -f examples/support_triage/support_triage.pi.j3a ]; then echo "ok=1" >> $GITHUB_OUTPUT; else
            echo "ok=0" >> $GITHUB_OUTPUT
            echo "::warning title=ARM bench skipped::examples/support_triage/support_triage.pi.j3a is not committed yet; build/predict/bench steps were skipped"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.art.outputs.ok == '1'
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        if: steps.art.outputs.ok == '1'
        with:
          key: arm64
      - name: build the static binary that ships to the Pi
        if: steps.art.outputs.ok == '1'
        run: cargo build --release --target aarch64-unknown-linux-musl -p j3v
      - uses: actions/cache@v4
        if: steps.art.outputs.ok == '1'
        with:
          path: minilm.j3a
          key: minilm-1110a243-int8-${{ hashFiles('crates/j3v/src/encoder.rs') }}
      - name: import the shared int8 encoder
        if: steps.art.outputs.ok == '1'
        run: |
          [ -f minilm.j3a ] && exit 0
          mkdir -p hf && for f in model.safetensors config.json vocab.txt tokenizer_config.json; do curl -sSfL "$MINILM/$f" -o hf/$f; done
          target/aarch64-unknown-linux-musl/release/j3v encoder import hf -o minilm.j3a sentence-transformers/all-MiniLM-L6-v2@1110a243
      - name: predict
        if: steps.art.outputs.ok == '1'
        run: |
          target/aarch64-unknown-linux-musl/release/j3v predict --encoder minilm.j3a examples/support_triage/support_triage.pi.j3a \
            '{"state": {"message": "I was charged twice, please refund me"}}'
      - name: bench (1 core, 1 thread; Pi 5 is a Cortex-A76, this runner is a newer Neoverse core, so treat as a lower bound)
        if: steps.art.outputs.ok == '1'
        run: |
          J=target/aarch64-unknown-linux-musl/release/j3v
          lscpu | grep -E "Model name|^CPU\(s\)" || true
          taskset -c 0 $J bench --encoder minilm.j3a examples/support_triage/support_triage.pi.j3a examples/support_triage/bench.jsonl --n 1000 --threads 1 | tee bench.json
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, os
          b = json.load(open("bench.json"))
          size = os.path.getsize("target/aarch64-unknown-linux-musl/release/j3v")
          print("### pi runtime on ARM64 (%s kernel)" % b["kernel"])
          print("| binary | questions | mean tokens | p50 ms | p95 ms | p99 ms |\n|---|---|---|---|---|---|")
          print("| %.2f MB | %d | %.1f | %.2f | %.2f | %.2f |" % (size / 1e6, b["questions"], b["mean_tokens"], b["p50_ms"], b["p95_ms"], b["p99_ms"]))
          PY
  firmware:
    name: mcu firmware (Cortex-M7, QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nfirmware/cortex-m7 -> target"
      - run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm
      - run: cargo build --release -p j3v
      - name: generate firmware model from the committed mcu artifact
        run: ./target/release/j3v mcu-codegen examples/support_triage/support_triage.mcu.j3a -o firmware/cortex-m7/src/model.rs
      - name: build firmware (QEMU mps2-an500 and STM32H743 memory maps)
        working-directory: firmware/cortex-m7
        run: |
          cargo build --release --features stm32h743
          cargo build --release
      - name: run in QEMU and compare with the host runtime
        run: |
          # -icount shift=0: one instruction per virtual ns, so the firmware's SysTick bench counts instructions
          timeout 300 qemu-system-arm -cpu cortex-m7 -machine mps2-an500 -nographic -icount shift=0 \
            -semihosting-config enable=on,target=native \
            -kernel firmware/cortex-m7/target/thumbv7em-none-eabihf/release/j3v-fw-cortex-m7 > qemu.txt
          ./target/release/j3v mcu-predict examples/support_triage/support_triage.mcu.j3a firmware/cortex-m7/src/inputs.txt > host.txt
          cat qemu.txt
          diff host.txt <(grep -v '^#' qemu.txt)
          { echo "### mcu firmware (Cortex-M7, QEMU -icount)"; grep '^#' qemu.txt | sed 's/^# /- /'; \
            echo "- flash: $(size -A firmware/cortex-m7/target/thumbv7em-none-eabihf/release/j3v-fw-cortex-m7 | awk '/^.text|^.rodata/ {s+=$2} END {print s}') bytes (.text + .rodata)"; } >> $GITHUB_STEP_SUMMARY

  cascade:
    name: cascade conformance (mcu -> pi -> Laya, offline)
    runs-on: ubuntu-latest
    env:
      MINILM: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p j3v
      - uses: actions/cache@v4
        with:
          path: minilm.j3a
          key: minilm-x86-1110a243-int8-${{ hashFiles('crates/j3v/src/encoder.rs') }}
      - name: import the shared int8 encoder
        run: |
          [ -f minilm.j3a ] && exit 0
          mkdir -p hf && for f in model.safetensors config.json vocab.txt tokenizer_config.json; do curl -sSfL "$MINILM/$f" -o hf/$f; done
          ./target/release/j3v encoder import hf -o minilm.j3a sentence-transformers/all-MiniLM-L6-v2@1110a243
      - name: certify the cascade on the held-out states (fails with E0401 if a tier breaks its threshold)
        run: |
          D=examples/support_triage
          ./target/release/j3v cascade --mcu $D/support_triage.mcu.j3a --pi $D/support_triage.pi.j3a --encoder minilm.j3a \
            --states $D/data/heldout.jsonl --teacher $D/data/laya.heldout.json -o cascade.json 2> cascade.txt || { cat cascade.txt; exit 1; }
          cat cascade.txt
          { echo '### cascade (offline, cached Laya answers)'; echo '```'; sed -n '/routing with conditional/,$p' cascade.txt | grep -v 'conditional temperatures'; echo '```'; } >> $GITHUB_STEP_SUMMARY
