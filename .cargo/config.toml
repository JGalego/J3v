# Static, self-contained builds for the pi runtime. rust-lld + Rust's bundled musl CRT means no
# cross C toolchain is needed: `cargo build --release --target aarch64-unknown-linux-musl`.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
